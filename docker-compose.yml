version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: flashmind_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend_flask
    container_name: flashmind_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=flashcard_db
      - UPLOAD_DIR=/app/uploads
      - GENERATED_DIR=/app/generated
      - JWT_SECRET_KEY=change-me-in-production
    volumes:
      - ./uploads:/app/uploads
      - ./generated:/app/generated
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
